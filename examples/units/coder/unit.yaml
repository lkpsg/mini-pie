kind: agent
description: Coding agent with input and output hooks
model: main
systemPrompt:
  file: ./prompts/system.md
userPrompt: "Complete this task:\n\n{{input}}"
tools: [read, write, edit, bash, grep, find, ls, http_request, sleep, todo]
subagents: [explorer]
thinking: medium
maxTurns: 32
maxToolCalls: 64
compaction:
  enabled: true
  keepRecentTokens: 16000
  reserveTokens: 8192
hooks:
  before:
    - id: prepare_input
      entry: ./src/hooks.ts#prepareInput
  after:
    - id: parse_output
      entry: ./src/hooks.ts#parseOutput
