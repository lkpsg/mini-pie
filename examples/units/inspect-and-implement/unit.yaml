kind: graph
description: Graph with code preparation, parallel analysis, a guarded loop, and human review
entry: prepare
maxSteps: 24
maxVisits: 4
maxConcurrency: 3

nodes:
  prepare:
    type: code
    entry: ./src/nodes.ts#prepare
    input:
      $ref: input

  inspect:
    type: agent
    unit: explorer
    input:
      task:
        $ref: results.prepare.output.task
      request: Inspect relevant files and constraints.

  risks:
    type: agent
    unit: explorer
    input:
      analysis:
        $ref: results.inspect.output
      request: Identify implementation risks.

  tests:
    type: agent
    unit: explorer
    input:
      analysis:
        $ref: results.inspect.output
      request: Propose focused tests.

  plan:
    type: code
    entry: ./src/nodes.ts#buildPlan
    join: all
    input:
      task:
        $ref: results.prepare.output.task
      analysis:
        $ref: results.inspect.output
      risks:
        $ref: results.risks.output
      tests:
        $ref: results.tests.output

  implement:
    type: agent
    unit: coder
    join: any
    input:
      $ref: results.plan.output
    review:
      before: true
      after: true
      message: Review the implementation request and result.

  classify:
    type: code
    entry: ./src/nodes.ts#classify
    input:
      $ref: results.implement.output

edges:
  - from: prepare
    to: inspect
  - from: inspect
    to: risks
  - from: inspect
    to: tests
  - from: risks
    to: plan
  - from: tests
    to: plan
  - from: plan
    to: implement
  - from: implement
    to: classify
  - from: classify
    to: implement
    when:
      path: results.classify.output.status
      equals: retry

output:
  $ref: results.classify.output
