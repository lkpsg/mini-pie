version: 2
workspace: ..

storage:
  directory: .mini-pie/runs

models:
  main:
    api: openai-responses
    model: gpt-5
    provider: openai
    baseUrl: ${OPENAI_BASE_URL}
    apiKeyEnv: OPENAI_API_KEY
    reasoning: true
    contextWindow: 400000
    maxTokens: 32000

  fast:
    api: anthropic-messages
    model: claude-haiku-4-5
    provider: anthropic
    apiKeyEnv: ANTHROPIC_API_KEY
    contextWindow: 200000
    maxTokens: 8192

units:
  coder: ./units/coder
  explorer: ./units/explorer
  inspect-and-implement: ./units/inspect-and-implement
