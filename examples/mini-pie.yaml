version: 2
workspace: ..

storage:
  directory: .mini-pie/runs

models:
  default:
    api: openai-completions
    model: ${OPENAI_MODEL}
    provider: openai-compatible
    baseUrl: ${OPENAI_BASE_URL}
    apiKeyEnv: OPENAI_API_KEY

units:
  summary-agent: ./units/summary-agent
  explanation-agent: ./units/explanation-agent
  summary-with-hooks: ./units/summary-with-hooks
  reviewed-summary: ./units/reviewed-summary
  routed-text: ./units/routed-text
